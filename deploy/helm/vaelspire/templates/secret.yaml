{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" (include "vaelspire.fullname" .) }}
  labels:
    {{- include "vaelspire.labels" . | nindent 4 }}
type: Opaque
stringData:
  VAELSPIRE_AUTH_KEY: {{ required "Set secrets.authKey (64 hex chars via `vaelspire keygen`) or secrets.existingSecret" .Values.secrets.authKey | quote }}
{{- end }}
