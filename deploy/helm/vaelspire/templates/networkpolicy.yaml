{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaelspire.fullname" . }}
  labels:
    {{- include "vaelspire.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vaelspire.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
{{- end }}
