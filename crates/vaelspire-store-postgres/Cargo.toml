[package]
name = "vaelspire-store-postgres"
version.workspace = true
authors.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vaelspire-core = { path = "../vaelspire-core" }
neotales-dbapi = "=0.0.0-alpha.0"
neotales-dbapi-postgres = "=0.0.0-alpha.0"
neotales-migration = "=0.0.0-alpha.0"
neotales-migration-postgres = "=0.0.0-alpha.0"
async-trait = "0.1"
serde_json.workspace = true
time = { version = "0.3", features = ["macros"] }

[features]
oidc = ["social", "vaelspire-core/oidc"]
default = []
password = []
session = []
mfa = ["vaelspire-auth/mfa"]
social = ["vaelspire-core/social"]


[lints]
workspace = true

[dev-dependencies]
vaelspire-auth = { path = "../vaelspire-auth", features = ["apikeys", "email-signin", "social"] }
# Decodes the caller-visible enrollment secret in the shared MFA contract.
base64.workspace = true
uuid = { version = "1", features = ["v7"] }
bcrypt = "0.19.3"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
testcontainers = "=0.28.0"
# Test-only inspector for assertions. The adapter itself goes through `neotales-dbapi`;
# this crate is not part of its public API.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
