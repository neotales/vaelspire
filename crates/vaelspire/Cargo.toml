[package]
name = "vaelspire"
description = "Single-binary Open-Core identity and authentication CLI/server by Neotales"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "vaelspire"
path = "src/main.rs"

[features]
default = []
embed-ui = ["dep:rust-embed", "dep:mime_guess"]
passkey = ["vaelspire-auth/passkey", "vaelspire-axum/passkey"]
alerts-email = ["vaelspire-alerts/email"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
mime_guess = { version = "2", optional = true }
neotales-dbapi = "=0.0.0-alpha.0"
rust-embed = { version = "8", optional = true }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7"] }
vaelspire-alerts = { path = "../vaelspire-alerts" }
vaelspire-auth = { path = "../vaelspire-auth", features = ["password", "session", "apikeys", "email-signin"] }
vaelspire-axum = { path = "../vaelspire-axum", features = ["password", "session", "apikeys", "email-signin"] }
vaelspire-core = { path = "../vaelspire-core" }
vaelspire-oidc = { path = "../vaelspire-oidc" }
vaelspire-store-sqlite = { path = "../vaelspire-store-sqlite" }
vaelspire-verify = { path = "../vaelspire-verify" }
zeroize.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile = "3.24"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
