[package]
name = "vaelspire"
description = "Single-binary Open-Core identity and authentication CLI/server by Neotales"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "vaelspire"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
neotales-dbapi = "=0.0.0-alpha.0"
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7"] }
vaelspire-auth = { path = "../vaelspire-auth", features = ["password", "session", "apikeys", "email-signin"] }
vaelspire-axum = { path = "../vaelspire-axum", features = ["password", "session", "apikeys", "email-signin"] }
vaelspire-core = { path = "../vaelspire-core" }
vaelspire-store-sqlite = { path = "../vaelspire-store-sqlite" }
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.24"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
