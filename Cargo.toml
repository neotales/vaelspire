[workspace]
members = [
    "crates/vaelspire-core",
    "crates/vaelspire-auth",
    "crates/vaelspire-email",
    "crates/vaelspire-axum",
    "crates/vaelspire-store-sqlite",
    "crates/vaelspire-store-postgres",
    "crates/vaelspire-verify",
    "crates/vaelspire-oidc",
    "crates/vaelspire",
]
resolver = "3"

[workspace.package]
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
authors = ["Neotales"]
repository = "https://github.com/neotales/vaelspire"

[workspace.dependencies]
aes-gcm = "0.11.1"
base64 = "0.22"
p256 = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
